(function(){
  "use strict";
  var button=document.getElementById("pwa-install");
  var installPrompt=null;
  if(!button)return;
  var standalone=window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches;
  if(standalone||window.navigator.standalone===true)button.hidden=true;
  window.addEventListener("beforeinstallprompt",function(event){
    event.preventDefault();
    installPrompt=event;
    button.classList.add("is-ready");
  });
  button.addEventListener("click",async function(){
    if(installPrompt){
      installPrompt.prompt();
      var choice=await installPrompt.userChoice;
      if(choice&&choice.outcome==="accepted")button.hidden=true;
      installPrompt=null;
      button.classList.remove("is-ready");
      return;
    }
    var isIOS=/iPad|iPhone|iPod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
    var message=isIOS
      ?"Para instalar o Púlpito Bible no iPhone: abra este endereço no Safari, toque em Compartilhar (quadrado com seta para cima), escolha “Adicionar à Tela de Início” e confirme em “Adicionar”. Se aparecer “Abrir como App”, deixe ativado. Depois abra o ícone Púlpito Bible na tela inicial."
      :/Android/i.test(navigator.userAgent)
        ?"No Android, abra esta página no Google Chrome, toque no menu ⋮ e escolha “Instalar app”. Se aparecer “Adicionar à tela inicial”, confirme."
        :"Abra esta página no navegador do celular e escolha “Instalar aplicativo” ou “Adicionar à tela inicial”.";
    window.alert(message);
  });
  window.addEventListener("appinstalled",function(){button.hidden=true;});
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("/pulpito-sw.js",{scope:"/",updateViaCache:"none"})
        .then(function(registration){registration.update().catch(function(){});})
        .catch(function(error){console.warn("Não foi possível registrar o modo instalável:",error);});
    });
  }
})();
</script><script>
/* Atualização do APK: botão sempre acessível e aviso quando nova versão é detectada. */
(function(){
 var nativeApp=!!(window.Capacitor&&typeof window.Capacitor.isNativePlatform==="function"&&window.Capacitor.isNativePlatform()) || /^(localhost|127\\.0\\.1)$/.test(location.hostname)&&/Android/i.test(navigator.userAgent);
 if(!nativeApp)return;
 var localVersion="pb-20261109-toolbar-v34";
 var builds="https://github.com/leonardo120719/mercado-app./actions/workflows/android-apk.yml";
 var endpoint="https://pulpito-bible-android.onrender.com/app.js";
 var notified=false;
 function show(newer){
  var box=document.getElementById("pb-apk-updater");
  if(!box){
   box=document.createElement("aside");box.id="pb-apk-updater";box.setAttribute("aria-label","Atualização do Púlpito Bible");
   box.style.cssText="position:fixed;bottom:12px;right:12px;z-index:999999;background:#123b48;color:#fff;padding:12px;border-radius:12px;max-width:310px;box-shadow:0 4px 20px #0005;font:13px system-ui";
   var title=document.createElement("strong");title.id="pb-apk-update-title";box.appendChild(title);
   var buttons=document.createElement("div");buttons.style.cssText="display:flex;gap:8px;margin-top:8px";
   var open=document.createElement("button");open.textContent="Atualizar APK";open.type="button";open.style.cssText="background:white;color:#123b48;border:0;padding:8px;border-radius:7px;font-weight:bold";open.onclick=function(){window.open(builds,"_system");};
   var later=document.createElement("button");later.textContent="Fechar";later.type="button";later.style.cssText="background:transparent;color:white;border:1px solid white;padding:8px;border-radius:7px";later.onclick=function(){box.style.display="none";};
   buttons.append(open,later);box.appendChild(buttons);document.body.appendChild(box);
  }
  box.querySelector("#pb-apk-update-title").textContent=newer?"Nova versão disponível! Atualize o Púlpito Bible.":"Púlpito Bible • Verificar atualizações";
  box.style.display="block";
 }
 async function check(){
  if(!navigator.onLine)return;
  try{
   var response=await fetch(endpoint+"?v="+Date.now(),{cache:"no-store"});
   if(!response.ok)return;
   var content=await response.text();
   var match=content.match(/window\\.PB_BUILD_ID\\s*=\\s*["']([^"']+)["']/);
   if(match&&match[1]!==localVersion&&!notified){notified=true;show(true);}
  }catch(e){/* Rede ou CORS indisponível: opção manual continua acessível. */}
 }
 function init(){
  var shortcut=document.createElement("button");shortcut.type="button";shortcut.textContent="↻ Atualizações";shortcut.setAttribute("aria-label","Verificar atualizações do Púlpito Bible");
  shortcut.style.cssText="position:fixed;right:12px;bottom:12px;z-index:999998;background:#123b48;color:white;border:1px solid #ffffff66;border-radius:24px;padding:8px 12px;font:12px system-ui";
  shortcut.onclick=function(){show(false);check();};document.body.appendChild(shortcut);
  check();
 }
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
 window.addEventListener("online",check);
 document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")check();});
 setInterval(check,3600000);
})();
</script>
