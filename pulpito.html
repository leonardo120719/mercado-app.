(function(){
  "use strict";
  var button=document.getElementById("pwa-install");
  var installPrompt=null;
  if(!button)return;
  var standalone=window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches;
  if(standalone||window.navigator.standalone===true)button.hidden=true;
  window.addEventListener("beforeinstallprompt",function(event){
    event.preventDefault();
    installPrompt=event;
    button.classList.add("is-ready");
  });
  button.addEventListener("click",async function(){
    if(installPrompt){
      installPrompt.prompt();
      var choice=await installPrompt.userChoice;
      if(choice&&choice.outcome==="accepted")button.hidden=true;
      installPrompt=null;
      button.classList.remove("is-ready");
      return;
    }
    var isIOS=/iPad|iPhone|iPod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
    var message=isIOS
      ?"Para instalar o Púlpito Bible no iPhone: abra este endereço no Safari, toque em Compartilhar (quadrado com seta para cima), escolha “Adicionar à Tela de Início” e confirme em “Adicionar”. Se aparecer “Abrir como App”, deixe ativado. Depois abra o ícone Púlpito Bible na tela inicial."
      :/Android/i.test(navigator.userAgent)
        ?"No Android, abra esta página no Google Chrome, toque no menu ⋮ e escolha “Instalar app”. Se aparecer “Adicionar à tela inicial”, confirme."
        :"Abra esta página no navegador do celular e escolha “Instalar aplicativo” ou “Adicionar à tela inicial”.";
    window.alert(message);
  });
  window.addEventListener("appinstalled",function(){button.hidden=true;});
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("/pulpito-sw.js",{scope:"/",updateViaCache:"none"})
        .then(function(registration){registration.update().catch(function(){});})
        .catch(function(error){console.warn("Não foi possível registrar o modo instalável:",error);});
    });
  }
})();
</script><script>
/* Atualizador nativo do APK Púlpito Bible: verifica versão, baixa com progresso e chama o instalador Android. */
(function(){
 "use strict";
 var isNative=!!(window.Capacitor&&typeof window.Capacitor.isNativePlatform==="function"&&window.Capacitor.isNativePlatform());
 if(!isNative)return;
 var releaseEndpoint="https://raw.githubusercontent.com/leonardo120719/mercado-app./pulpito-bible-pwa/pulpito-release.json";
 var native=window.Capacitor.registerPlugin("ApkUpdater");
 var release=null, installed=0, busy=false, timer=null;
 var box, status, progress, fill, action, verify;
 function ui(){
  if(box)return;
  box=document.createElement("section");box.id="pb-apk-updater";
  box.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:999999;background:#123b48;color:#fff;padding:15px;border-radius:16px;box-shadow:0 8px 30px #0007;font:14px/1.45 system-ui;max-width:520px;margin:auto";
  var heading=document.createElement("strong");heading.textContent="Atualização do Púlpito Bible";heading.style.cssText="display:block;font-size:16px;margin-bottom:6px";
  status=document.createElement("div");status.textContent="Verificando atualizações…";
  progress=document.createElement("div");progress.style.cssText="height:8px;background:#ffffff40;border-radius:20px;overflow:hidden;margin-top:10px;display:none";
  fill=document.createElement("div");fill.style.cssText="height:100%;width:0;background:#72d69b;transition:width .2s";progress.appendChild(fill);
  var row=document.createElement("div");row.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px";
  action=document.createElement("button");action.type="button";action.textContent="Baixar e instalar";action.style.cssText="background:#fff;color:#123b48;border:0;padding:10px 14px;border-radius:9px;font-weight:700";action.hidden=true;action.onclick=download;
  verify=document.createElement("button");verify.type="button";verify.textContent="Verificar atualização";verify.style.cssText="background:transparent;color:#fff;border:1px solid #ffffff80;padding:10px 14px;border-radius:9px";verify.onclick=check;
  var close=document.createElement("button");close.type="button";close.textContent="Fechar";close.style.cssText="background:transparent;color:#fff;border:0;padding:10px";close.onclick=function(){box.remove();box=null;};
  row.append(action,verify,close);box.append(heading,status,progress,row);document.body.appendChild(box);
 }
 function message(text){ui();status.textContent=text;}
 async function check(){
  if(busy)return;
  try{
   message("Verificando se existe uma nova versão…");
   var v=await native.getInstalledVersion();installed=Number(v.versionCode||0);
   var response=await fetch(releaseEndpoint+"?t="+Date.now(),{cache:"no-store"});
   if(!response.ok)throw Error("Não foi possível consultar a versão publicada.");
   var data=await response.json();
   if(!data.apk_url||!data.sha256||!Number(data.version_code))throw Error("Informações da atualização incompletas.");
   release=data;
   if(Number(data.version_code)>installed){
    message("Nova versão "+(data.version_name||"")+" disponível. Suas Bíblias, comentários e dicionários serão preservados.");
    action.hidden=false;action.disabled=false;action.textContent="Baixar e instalar";
   }else{
    message("Seu Púlpito Bible já está atualizado.");
    action.hidden=true;
   }
  }catch(e){message(e&&e.message?e.message:"Não foi possível verificar a atualização. Confira sua conexão.");}
 }
 async function download(){
  if(!release||busy)return;
  busy=true;action.disabled=true;action.textContent="Baixando…";progress.style.display="block";fill.style.width="0%";
  message("Preparando o download seguro do APK…");
  try{
   await native.startDownload({url:release.apk_url,sha256:release.sha256,versionName:release.version_name||("1.0."+release.version_code)});
   if(timer)clearInterval(timer);
   timer=setInterval(async function(){
    try{
     var s=await native.getDownloadStatus();
     if(s.totalBytes>0){var pct=Math.max(0,Math.min(100,Math.round(s.downloadedBytes*100/s.totalBytes)));fill.style.width=pct+"%";message("Baixando atualização… "+pct+"%");}
     if(s.status==="complete"){clearInterval(timer);timer=null;message("Download concluído. Verificando o arquivo e abrindo o instalador do Android…");action.textContent="Aguardando instalador";busy=false;}
     if(s.status==="failed"){clearInterval(timer);timer=null;throw Error(s.reason||"Falha no download.");}
    }catch(e){if(timer){clearInterval(timer);timer=null;}busy=false;action.disabled=false;action.textContent="Tentar novamente";message(e.message||"Falha ao acompanhar o download.");}
   },850);
  }catch(e){busy=false;action.disabled=false;action.textContent="Tentar novamente";message(e&&e.message?e.message:"Não foi possível iniciar o download.");}
 }
 async function resume(){try{await native.installPending();}catch(e){console.warn("Púlpito Bible: instalador pendente",e);}}
 function init(){ui();check();resume();window.addEventListener("online",check);document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"){resume();check();}});setInterval(check,6*60*60*1000);}
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
<script>
/* Ajuste de leitura por gesto de dois dedos, separado da seleção de versículos. */
(function(){
 var zones=[
  {selector:"#chapter-body",name:"bible",content:".verse-list"},
  {selector:"#pb-split-comments .pb-split-scroll",name:"commentary",content:".pb-split-entry-text"},
  {selector:".pb-dictionary-scroll",name:"dictionary",content:".pb-dict-entry-title, .pb-dict-definition, .pb-dictionary-scroll p, .pb-dictionary-scroll li"}
 ];
 var sizes={};
 zones.forEach(function(z){var n=Number(localStorage.getItem("pb-text-zoom-"+z.name));sizes[z.name]=Number.isFinite(n)&&n>=0.75&&n<=1.8?n:1;});
 var style=document.createElement("style");style.id="pb-responsive-text-zoom";document.head.appendChild(style);
 function paint(){
  style.textContent=zones.map(function(z){return z.content.split(",").map(function(sel){return sel.trim()+"{zoom:"+sizes[z.name].toFixed(3)+";}";}).join("\n");}).join("\n");
 }
 paint();
 var active=null;
 function zoneFor(el){if(!el||!el.closest)return null;return zones.find(function(z){return el.closest(z.selector);})||null;}
 function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
 document.addEventListener("touchstart",function(e){
  if(e.touches.length!==2){active=null;return;}
  var z=zoneFor(e.target);
  if(!z)return;
  var d=dist(e.touches[0],e.touches[1]);
  if(d<10)return;
  active={name:z.name,start:d,base:sizes[z.name]};
 },{passive:true});
 document.addEventListener("touchmove",function(e){
  if(!active||e.touches.length!==2)return;
  var d=dist(e.touches[0],e.touches[1]);
  sizes[active.name]=Math.max(.75,Math.min(1.8,Math.round(active.base*d/active.start*100)/100));
  paint();
  if(e.cancelable)e.preventDefault();
 },{passive:false});
 function finish(){if(!active)return;try{localStorage.setItem("pb-text-zoom-"+active.name,String(sizes[active.name]));}catch(e){}active=null;}
 document.addEventListener("touchend",function(e){if(active&&e.touches.length<2)finish();},{passive:true});
 document.addEventListener("touchcancel",finish,{passive:true});
})();
</script>
