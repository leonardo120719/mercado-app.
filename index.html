<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#145c49"><title>MERCADO</title><style>
*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f4f7f5;color:#19362e}header{background:#145c49;color:white;padding:22px 16px}h1{margin:0}main{max-width:850px;margin:auto;padding:14px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #143a2511}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #cbd8d0;max-width:100%}input{width:100%}button{background:#145c49;color:white;border:0;cursor:pointer}button.secondary{background:#e8efeb;color:#145c49}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:105px}nav{display:flex;overflow:auto;gap:7px;padding:10px;background:white}nav button{white-space:nowrap}.hidden{display:none}.item{padding:12px 0;border-bottom:1px solid #e1e8e4}.muted{color:#66776e;font-size:13px}.amount{font-weight:800;font-size:25px}.danger{color:#b32929}label{display:block;margin:8px 0}h2{font-size:19px}
</style></head><body><header><h1>🛒 MERCADO</h1><div>Suas compras e seu orçamento em um só lugar</div></header><main><div class="card" id="login"><h2>Entrar na conta</h2><form id="auth" class="row"><input type="email" id="email" placeholder="E-mail autorizado" required><input type="password" id="password" placeholder="Senha" required><button>Entrar</button></form><p id="status" class="muted">Conectando...</p><button class="secondary hidden" id="logout">Sair</button></div><div id="app" class="hidden"><nav><button data-page="list">🛒 Lista</button><button data-page="history">🕘 Histórico</button><button data-page="report">📊 Relatórios</button><button data-page="finance">💰 Entradas/Saídas</button></nav>
<section id="list" class="card"><h2>Minha lista</h2><div class="row"><label>Nome da lista<input id="listName" value="Compra do mês"></label><label>Orçamento (R$)<input id="budget" type="number" step=".01" min="0" value="1500"></label></div><div class="row"><div>Gasto estimado<div class="amount" id="total"></div></div><div>Saldo disponível<div class="amount" id="remaining"></div></div></div><h2>Adicionar produto</h2><form id="add" class="row"><input id="name" placeholder="Produto" required><input id="qty" type="number" min=".001" step="any" value="1" required><select id="unit"><option>un</option><option>kg</option><option>g</option><option>L</option><option>pacote</option><option>caixa</option></select><input id="price" type="number" step=".01" min="0" placeholder="Preço R$" required><button>Adicionar</button></form><label>🔎 Buscar produto<input id="search" placeholder="Pesquisar na lista"></label><div id="items"></div><p><button id="finish">Finalizar compra e salvar no histórico</button></p></section>
<section id="history" class="card hidden"><h2>Histórico de compras</h2><label>🔎 Pesquisar por produto<input id="searchHistory" placeholder="Nome do produto"></label><div id="purchases"></div></section>
<section id="report" class="card hidden"><h2>Relatório mensal</h2><div id="months"></div><button id="export">Exportar relatório CSV</button></section>
<section id="finance" class="card hidden"><h2>Entradas e saídas</h2><form id="addTx" class="row"><input id="desc" placeholder="Descrição" required><input id="value" type="number" min=".01" step=".01" placeholder="Valor R$" required><select id="kind"><option value="entrada">Entrada</option><option value="saida">Saída</option></select><button>Registrar</button></form><div id="txs"></div></section></div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.95.3';
const db=createClient('https://tmfxagpryefygjgerfly.supabase.co','sb_publishable_zRQ4UdWpEJfm1x2Lq6u7Jw_jMcJiB_q');
const $=id=>document.getElementById(id),money=n=>(n/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),cents=n=>Math.round(Number(n||0)*100),uid=()=>crypto.randomUUID(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user=null,rev=0,channel=null,saving=false,dirty=false;
let s={items:[],pantry:[],tx:[],history:[],limit:150000,listName:'Compra do mês'};
const status=t=>$('status').textContent=t;
function mutate(fn){fn();dirty=true;render();save()}
async function load(){if(!user)return;const{data,error}=await db.from('mercado_data').select('data,revision').eq('user_id',user.id).single();if(error){status(error.message);return}if(dirty||saving)return;s={items:[],pantry:[],tx:[],history:[],limit:150000,listName:'Compra do mês',...data.data};rev=Number(data.revision);render();status('Sincronizado com Supabase')}
async function save(){if(saving)return;saving=true;while(dirty){dirty=false;const payload=structuredClone(s);const{data,error}=await db.rpc('mercado_save',{payload,expected_revision:rev});if(error){status('Não salvo: '+error.message+' — confira antes de atualizar.');dirty=false;break}rev=Number(data);status('Salvo na nuvem')}saving=false}
function render(){ $('listName').value=s.listName;$('budget').value=s.limit/100;const total=s.items.reduce((a,i)=>a+i.qty*i.price,0);$('total').textContent=money(total);$('remaining').textContent=money(s.limit-total);$('remaining').className='amount'+(s.limit<total?' danger':'');
$('items').innerHTML=s.items.filter(i=>i.name.toLowerCase().includes($('search').value.toLowerCase())).map(i=>'<div class="item"><b>'+esc(i.name)+'</b> — '+esc(i.qty)+' '+esc(i.unit)+' × '+money(i.price)+' = <b>'+money(Math.round(i.qty*i.price))+'</b><div class="row"><button class="secondary" data-edit="'+i.id+'">Editar</button><button class="secondary" data-del="'+i.id+'">Excluir</button></div></div>').join('')||'<p class="muted">Nenhum produto.</p>';
$('purchases').innerHTML=s.history.filter(h=>!$('searchHistory').value||h.items.some(i=>i.name.toLowerCase().includes($('searchHistory').value.toLowerCase()))).slice().reverse().map(h=>'<div class="item"><b>'+esc(h.name||'Compra')+'</b> — '+new Date(h.date).toLocaleDateString('pt-BR')+'<p>'+h.items.map(i=>esc(i.name)+' ('+i.qty+' '+esc(i.unit)+')').join(', ')+'</p><b>'+money(h.items.reduce((a,i)=>a+Math.round(i.qty*i.price),0))+'</b><div class="row"><button class="secondary" data-reopen="'+h.id+'">Reabrir para editar</button><button class="secondary" data-rename="'+h.id+'">Renomear</button></div></div>').join('')||'<p class="muted">Sem compras finalizadas.</p>';
const grouped={};for(const h of s.history){const k=h.date.slice(0,7);grouped[k]=(grouped[k]||0)+h.items.reduce((a,i)=>a+Math.round(i.qty*i.price),0)}$('months').innerHTML=Object.entries(grouped).sort((a,b)=>b[0].localeCompare(a[0])).map(([k,v])=>'<p><b>'+k.split('-').reverse().join('/')+'</b> — '+money(v)+'</p>').join('')||'Sem registros';
$('txs').innerHTML=s.tx.slice().reverse().map(t=>'<div class="item">'+esc(t.desc)+' — '+esc(t.kind)+' <b>'+money(t.value)+'</b></div>').join('')||'Sem movimentações'}
$('auth').onsubmit=async e=>{e.preventDefault();status('Entrando...');const{data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return status(error.message);await enter(data.user)};
async function enter(u){user=u;$('auth').classList.add('hidden');$('logout').classList.remove('hidden');$('app').classList.remove('hidden');await load();if(channel)db.removeChannel(channel);channel=db.channel('mercado-'+u.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'mercado_data',filter:'user_id=eq.'+u.id},()=>{if(!dirty&&!saving)load()}).subscribe()}
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('section').forEach(e=>e.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden')});
$('add').onsubmit=e=>{e.preventDefault();mutate(()=>s.items.push({id:uid(),name:$('name').value.trim(),qty:Number($('qty').value),unit:$('unit').value,price:cents($('price').value)}));$('add').reset();$('qty').value=1};
$('listName').onchange=()=>mutate(()=>s.listName=$('listName').value);
$('budget').onchange=()=>mutate(()=>s.limit=cents($('budget').value));
$('search').oninput=render;$('searchHistory').oninput=render;
$('items').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.del;const i=s.items.find(x=>x.id===id);if(!i)return;if(b.dataset.del){if(confirm('Excluir produto?'))mutate(()=>s.items=s.items.filter(x=>x.id!==id));return}const n=prompt('Nome',i.name);if(n===null)return;const q=prompt('Quantidade',i.qty);if(q===null)return;const p=prompt('Preço unitário (R$)',i.price/100);if(p===null)return;if(!n.trim()||!(Number(q)>0)||!(Number(p)>=0))return alert('Dados inválidos');mutate(()=>{i.name=n.trim();i.qty=Number(q);i.price=cents(p)})};
$('finish').onclick=()=>{if(!s.items.length)return alert('Adicione produtos');if(!confirm('Finalizar esta compra?'))return;mutate(()=>{s.history.push({id:uid(),name:s.listName,date:new Date().toISOString(),items:structuredClone(s.items)});s.items=[]})};
$('purchases').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.reopen||b.dataset.rename;const h=s.history.find(x=>x.id===id);if(!h)return;if(b.dataset.rename){const n=prompt('Nome da compra',h.name);if(n?.trim())mutate(()=>h.name=n.trim());return}if(s.items.length&&!confirm('Sua lista atual será substituída. Continuar?'))return;mutate(()=>{s.items=structuredClone(h.items);s.listName=h.name;s.history=s.history.filter(x=>x.id!==id)});document.querySelector('[data-page="list"]').click()};
$('addTx').onsubmit=e=>{e.preventDefault();mutate(()=>s.tx.push({id:uid(),desc:$('desc').value,kind:$('kind').value,value:cents($('value').value),date:new Date().toISOString()}));$('addTx').reset()};
$('export').onclick=()=>{const rows=[['Data','Compra','Produto','Quantidade','Unidade','Preço unitário','Subtotal']];for(const h of s.history)for(const i of h.items)rows.push([h.date,h.name,i.name,i.qty,i.unit,(i.price/100).toFixed(2),(i.qty*i.price/100).toFixed(2)]);const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='mercado-relatorio.csv';a.click();URL.revokeObjectURL(a.href)};
const{data:{session}}=await db.auth.getSession();if(session?.user)await enter(session.user);else status('Entre com uma conta autorizada pelo administrador.');
</script></body></html>
