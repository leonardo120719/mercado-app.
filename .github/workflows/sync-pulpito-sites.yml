name: Sincronizar publicações do Púlpito Bible

on:
  workflow_dispatch:
  push:
    branches:
      - pulpito-bible-pwa
    paths:
      - "app.js"
      - "pulpito.html"
      - "styles.css"
      - "pulpito-sw.js"
      - "pulpito-manifest.webmanifest"
      - "pulpito-acervo.json"
      - "pulpito-crossrefs.json"
      - "pulpito-icon-*.svg"
      - ".github/workflows/sync-pulpito-sites.yml"

permissions:
  contents: write

concurrency:
  group: publish-pulpito-bible-site
  cancel-in-progress: false

jobs:
  sync-main-site:
    runs-on: ubuntu-latest
    steps:
      - name: Obter versão oficial do Púlpito Bible
        uses: actions/checkout@v4
        with:
          ref: pulpito-bible-pwa
          path: source

      - name: Obter site principal
        uses: actions/checkout@v4
        with:
          ref: pulpito-bible
          path: target

      - name: Sincronizar arquivos do aplicativo e da publicação
        shell: bash
        run: |
          set -euo pipefail
          assets=(app.js pulpito.html styles.css pulpito-sw.js pulpito-manifest.webmanifest
                  pulpito-acervo.json pulpito-crossrefs.json pulpito-icon-192.svg
                  pulpito-icon-512.svg pulpito-icon-official.svg)
          mkdir -p target/public
          for asset in "${assets[@]}"; do
            cp "source/$asset" "target/$asset"
            cp "source/$asset" "target/public/$asset"
          done
          sed -i 's|register("/pulpito-sw.js"|register("/pulpito-web-sw.js"|' target/pulpito.html
          cp target/pulpito.html target/public/pulpito.html
          cp target/pulpito.html target/public/index.html
          sed 's|"/pulpito-acervo.json"$|"/pulpito-acervo.json", "/pulpito-crossrefs.json"|' \
            source/pulpito-sw.js > target/public/pulpito-web-sw.js
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${assets[@]}" "${assets[@]/#/public/}" public/index.html public/pulpito-web-sw.js
          if git diff --cached --quiet; then
            echo "O site já está sincronizado."
            exit 0
          fi
          git commit -m "Publica o Púlpito Bible atualizado no site"
          git push origin HEAD:pulpito-bible
