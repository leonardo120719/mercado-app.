name: Publicar site do Púlpito Bible

on:
  workflow_call:
    inputs:
      version_code:
        required: true
        type: string
    secrets:
      RENDER_DEPLOY_HOOK:
        required: false

permissions:
  contents: write

concurrency:
  group: publish-pulpito-bible-site
  cancel-in-progress: false

jobs:
  sync-main-site:
    runs-on: ubuntu-latest
    steps:
      - name: Obter versão oficial do Púlpito Bible
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source

      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pulpito-bible-android-release-apk
          path: release-apk

      - name: Obter site principal
        uses: actions/checkout@v4
        with:
          ref: pulpito-bible
          path: target

      - name: Sincronizar arquivos da versão assinada
        id: sync
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f target/public/pulpito-release.json ]]; then
            current_version=$(jq -er '.version_code' target/public/pulpito-release.json)
            if (( current_version > VERSION_CODE )); then
              echo "O site já tem uma versão mais recente."
              exit 0
            fi
          fi
          mkdir -p target/public/downloads
          cp release-apk/app-release.apk target/public/downloads/pulpito-bible.apk
          apk_sha256=$(sha256sum release-apk/app-release.apk | awk '{print $1}')
          assets=(app.js pulpito.html styles.css pulpito-sw.js pulpito-manifest.webmanifest
                  pulpito-acervo.json pulpito-crossrefs.json pulpito-icon-192.svg
                  pulpito-icon-512.svg pulpito-icon-official.svg)
          mkdir -p target/public
          for asset in "${assets[@]}"; do
            cp "source/$asset" "target/$asset"
            cp "source/$asset" "target/public/$asset"
          done
          sed -i 's|register("/pulpito-sw.js"|register("/pulpito-web-sw.js"|' target/pulpito.html
          cp target/pulpito.html target/public/pulpito.html
          cp target/pulpito.html target/public/index.html
          sed 's|"/pulpito-acervo.json"$|"/pulpito-acervo.json", "/pulpito-crossrefs.json"|' \
            source/pulpito-sw.js > target/public/pulpito-web-sw.js
          jq -n --arg source_sha "$GITHUB_SHA" --argjson version_code "$VERSION_CODE" \
            --arg apk_url "https://pulpito-bible.onrender.com/downloads/pulpito-bible.apk" \
            --arg sha256 "$apk_sha256" \
            --arg version_name "1.0.$VERSION_CODE" \
            '{source_sha: $source_sha, version_code: $version_code, version_name: $version_name, apk_url: $apk_url, sha256: $sha256}' > target/public/pulpito-release.json
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${assets[@]}" "${assets[@]/#/public/}" public/index.html public/pulpito-web-sw.js public/pulpito-release.json public/downloads/pulpito-bible.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publica Púlpito Bible 1.0.$VERSION_CODE no site"
            git push origin HEAD:pulpito-bible
          fi
          echo "verify=true" >> "$GITHUB_OUTPUT"

      - name: Publicar e conferir a versão no Render
        if: steps.sync.outputs.verify == 'true'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          VERSION_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          site='https://pulpito-bible.onrender.com'
          release_is_live() {
            curl --fail --silent --max-time 8 -H 'Cache-Control: no-cache' \
              "$site/pulpito-release.json?build=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$1" |
              jq -e --arg sha "$GITHUB_SHA" --argjson version "$VERSION_CODE" \
                '.source_sha == $sha and .version_code == $version' >/dev/null
          }
          if release_is_live initial; then
            echo "A versão 1.0.$VERSION_CODE já está publicada."
            exit 0
          fi
          if [[ -n "$RENDER_DEPLOY_HOOK" ]]; then
            if ! curl --fail --silent --max-time 15 --request POST --output /dev/null "$RENDER_DEPLOY_HOOK"; then
              echo "::error::O Render recusou o deploy hook. Confira o segredo PULPITO_RENDER_DEPLOY_HOOK."
              exit 1
            fi
          fi
          for attempt in {1..12}; do
            if release_is_live "$attempt"; then
              echo "A versão 1.0.$VERSION_CODE está publicada no site."
              exit 0
            fi
            sleep 8
          done
          if [[ -z "$RENDER_DEPLOY_HOOK" ]]; then
            echo "::warning::O Render não foi atualizado porque o segredo PULPITO_RENDER_DEPLOY_HOOK não está configurado. O APK e o manifesto oficial já foram publicados no GitHub Releases e continuam disponíveis ao atualizador nativo."
            exit 0
          else
            echo "::error::O Render recebeu o pedido de publicação, mas a versão do APK ainda não está no site."
            exit 1
          fi
