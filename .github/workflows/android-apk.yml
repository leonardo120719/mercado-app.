name: Pulpito Bible Android APK
on:
  workflow_dispatch:
  push:
    branches: [pulpito-bible-pwa]
    paths:
      - 'app.js'
      - 'styles.css'
      - 'pulpito.html'
      - 'pulpito-sw.js'
      - 'pulpito-manifest.webmanifest'
      - 'pulpito-acervo.json'
      - 'pulpito-icon-*.svg'
      - '.github/workflows/android-apk.yml'
# Rebuild signed APK with module text decoding fix (2026-11-10).
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK from GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Prepare local Pulpito Bible web bundle
        run: |
          mkdir -p www
          cp pulpito.html www/index.html
          cp pulpito.html www/pulpito.html
          cp app.js styles.css pulpito-sw.js pulpito-manifest.webmanifest pulpito-acervo.json www/
          cp pulpito-icon-*.svg www/
          cat > package.json <<'EOF'
          {"name":"pulpito-bible-android","version":"1.0.0","private":true,"type":"module","dependencies":{"@capacitor/core":"^7.4.0","@capacitor/android":"^7.4.0"},"devDependencies":{"@capacitor/cli":"^7.4.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.pulpitobible.app","appName":"Púlpito Bible","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund sharp jszip@3.10.1 sql.js@1.13.0
          # Importadores ZIP/SQLite locais: funcionam no APK mesmo sem internet.
          mkdir -p www/vendor
          cp node_modules/jszip/dist/jszip.min.js www/vendor/jszip.min.js
          cp node_modules/sql.js/dist/sql-wasm.js www/vendor/sql-wasm.js
          cp node_modules/sql.js/dist/sql-wasm.wasm www/vendor/sql-wasm.wasm
          python3 - <<'PY'
          from pathlib import Path
          p=Path("www/index.html")
          html=p.read_text()
          html=html.replace("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js","./vendor/jszip.min.js")
          html=html.replace("https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js","./vendor/sql-wasm.js")
          p.write_text(html)
          Path("www/pulpito.html").write_text(html)
          p=Path("www/app.js")
          app=p.read_text().replace('return "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/"+f;', 'return "./vendor/"+f;')
          p.write_text(app)
          PY
          npx cap add android
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          import fs from "node:fs";
          const sizes={mdpi:48,hdpi:72,xhdpi:96,xxhdpi:144,xxxhdpi:192};
          const icon=await sharp("pulpito-icon-official.svg",{density:384}).png().toBuffer();
          // Legacy launcher: full icon; no additional Android foreground scaling.
          // Adaptive launcher: Android masks the outer 18dp on each side of a 108dp canvas.
          // Keep the entire artwork inside the central 66dp safe area to avoid cropping.
          for(const [density,size] of Object.entries(sizes)){
            const dir="android/app/src/main/res/mipmap-"+density;
            fs.mkdirSync(dir,{recursive:true});
            const legacy=await sharp(icon).resize(size,size).png().toBuffer();
            fs.writeFileSync(dir+"/ic_launcher.png",legacy);
            fs.writeFileSync(dir+"/ic_launcher_round.png",legacy);
            const canvas=Math.round(size*108/48);
            const safe=Math.round(canvas*0.61);
            await sharp(icon).resize(safe,safe).extend({
              top:Math.floor((canvas-safe)/2),
              bottom:Math.ceil((canvas-safe)/2),
              left:Math.floor((canvas-safe)/2),
              right:Math.ceil((canvas-safe)/2),
              background:{r:0,g:0,b:0,alpha:0}
            }).png().toFile(dir+"/ic_launcher_foreground.png");
          }
          // Remove generated adaptive icon XML and replace with a solid blue
          // background plus the padded foreground; prevents doubled zoom.
          const bgDir="android/app/src/main/res/values";
          fs.mkdirSync(bgDir,{recursive:true});
          fs.writeFileSync(bgDir+"/pulpito_icon_background.xml",
            '<?xml version="1.0" encoding="utf-8"?><resources><color name="pulpito_icon_background">#08214e</color></resources>');
          for(const folder of ["mipmap-anydpi-v26"]){
            const dir="android/app/src/main/res/"+folder;
            fs.mkdirSync(dir,{recursive:true});
            for(const name of ["ic_launcher.xml","ic_launcher_round.xml"]){
              fs.writeFileSync(dir+"/"+name,
                '<?xml version="1.0" encoding="utf-8"?>\n'+
                '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'+
                '  <background android:drawable="@color/pulpito_icon_background"/>\n'+
                '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'+
                '</adaptive-icon>\n');
            }
          }
          NODE
      # Nova tentativa de assinatura após correção da senha do keystore (2026-11-10).
      - name: Configure stable release signing and version
        env:
          PULPITO_KEYSTORE_BASE64: ${{ secrets.PULPITO_KEYSTORE_BASE64 }}
          PULPITO_KEYSTORE_PASSWORD: ${{ secrets.PULPITO_KEYSTORE_PASSWORD }}
          PULPITO_KEY_ALIAS: ${{ secrets.PULPITO_KEY_ALIAS }}
          PULPITO_KEY_PASSWORD: ${{ secrets.PULPITO_KEY_PASSWORD }}
          PULPITO_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib,re
          required=["PULPITO_KEYSTORE_BASE64","PULPITO_KEYSTORE_PASSWORD","PULPITO_KEY_ALIAS","PULPITO_KEY_PASSWORD"]
          missing=[k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit("Assinatura permanente não configurada. Adicione os quatro GitHub Actions secrets: "+", ".join(missing))
          root=pathlib.Path("android/app")
          (root/"pulpito-release.jks").write_bytes(base64.b64decode(os.environ["PULPITO_KEYSTORE_BASE64"],validate=True))
          gradle=root/"build.gradle"
          content=gradle.read_text()
          # Capacitor Android uses Groovy Gradle. The release signing is configured only
          # after reading the persistent GitHub Actions secrets, never in the repository.
          content=content.replace("android {", """android {
              signingConfigs {
                  pulpitoRelease {
                      storeFile file("pulpito-release.jks")
                      storePassword System.getenv("PULPITO_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("PULPITO_KEY_ALIAS")
                      keyPassword System.getenv("PULPITO_KEY_PASSWORD")
                  }
              }
          """,1)
          content=re.sub(r'versionCode\s+\d+', 'versionCode '+str(int(os.environ["PULPITO_VERSION_CODE"])),content,count=1)
          content=content.replace("release {", "release {\n            signingConfig signingConfigs.pulpitoRelease",1)
          gradle.write_text(content)
          PY
      - name: Build signed updateable release APK
        env:
          PULPITO_KEYSTORE_PASSWORD: ${{ secrets.PULPITO_KEYSTORE_PASSWORD }}
          PULPITO_KEY_ALIAS: ${{ secrets.PULPITO_KEY_ALIAS }}
          PULPITO_KEY_PASSWORD: ${{ secrets.PULPITO_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pulpito-bible-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
