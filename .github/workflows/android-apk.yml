name: Pulpito Bible Android APK
on:
  workflow_dispatch:
  push:
    branches: [pulpito-bible-pwa]
    paths:
      - 'app.js'
      - 'styles.css'
      - 'pulpito.html'
      - 'pulpito-sw.js'
      - 'pulpito-manifest.webmanifest'
      - 'pulpito-acervo.json'
      - 'pulpito-icon-*.svg'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK from GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Prepare local Pulpito Bible web bundle
        run: |
          mkdir -p www
          cp pulpito.html www/index.html
          cp pulpito.html www/pulpito.html
          cp app.js styles.css pulpito-sw.js pulpito-manifest.webmanifest pulpito-acervo.json www/
          cp pulpito-icon-*.svg www/
          cat > package.json <<'EOF'
          {"name":"pulpito-bible-android","version":"1.0.0","private":true,"type":"module","dependencies":{"@capacitor/core":"^7.4.0","@capacitor/android":"^7.4.0"},"devDependencies":{"@capacitor/cli":"^7.4.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.pulpitobible.app","appName":"Púlpito Bible","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund sharp
          npx cap add android
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          import fs from "node:fs";
          const sizes={mdpi:48,hdpi:72,xhdpi:96,xxhdpi:144,xxxhdpi:192};
          for(const [density,size] of Object.entries(sizes)){
            const dir="android/app/src/main/res/mipmap-"+density;
            fs.mkdirSync(dir,{recursive:true});
            for(const name of ["ic_launcher.png","ic_launcher_round.png","ic_launcher_foreground.png"]){
              await sharp("pulpito-icon-official.svg",{density:384}).resize(size,size).png().toFile(dir+"/"+name);
            }
          }
          NODE
      # Recompilação solicitada: barra superior simplificada e correções recentes.
      - name: Build installable debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pulpito-bible-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
