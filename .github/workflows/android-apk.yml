# Rebuild restored original reader without experimental windows (2026-11-11)
# Rebuild: restore compact original Bible toolbar and retain small inline window button (2026-11-11).
# APK rebuild requested: add-window button in dark Bible navigation toolbar (2026-11-11).
name: Pulpito Bible Android APK
on:
  workflow_dispatch:
  push:
    branches: [pulpito-bible-pwa]
    paths:
      - 'app.js'
      - 'styles.css'
      - 'pulpito.html'
      - 'pulpito-sw.js'
      - 'pulpito-manifest.webmanifest'
      - 'pulpito-acervo.json'
      - 'pulpito-crossrefs.json'
      - 'pulpito-icon-*.svg'
      - '.github/workflows/android-apk.yml'
# Rebuild signed APK with module text decoding fix (2026-11-10).
# Requested fresh signed APK build, including offline cross references.
# Rebuild requested 2026-11-11: Historical Study Diary beside Sermão.
# Build request: advanced Historical Study Diary with offline search and filters (2026-11-11).
# Build request 2026-11-11: searchable automatic study history with commentary and dictionary resume.
# Requested signed APK: integrated Bible map, sermon coach, voice assistant, synced panes and adaptive plans.
# Manual test build requested 2026-11-11 after integration fixes; retain existing Android appId and signing.
# Requested APK build after Janelas module window integration, commit cefa0e72.
# APK build requested: Janelas, devotional modules, reading plans, search and history (2026-11-11).
# APK build requested after search submission fix and three-feature integration, 2026-11-11.
# Build requested 2026-11-11: devotional ZIP/JSON import via Modules and daily reading in Plans.
# APK requested after synchronized inline study windows update (2026-11-11).
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.release.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK from GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Prepare local Pulpito Bible web bundle
        run: |
          mkdir -p www
          cp pulpito.html www/index.html
          cp pulpito.html www/pulpito.html
          cp app.js styles.css pulpito-sw.js pulpito-manifest.webmanifest pulpito-acervo.json pulpito-crossrefs.json www/
          cp pulpito-icon-*.svg www/
          cat > package.json <<'EOF'
          {"name":"pulpito-bible-android","version":"1.0.0","private":true,"type":"module","dependencies":{"@capacitor/core":"^7.4.0","@capacitor/android":"^7.4.0","@capacitor-community/speech-recognition":"^7.0.0"},"devDependencies":{"@capacitor/cli":"^7.4.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.pulpitobible.app","appName":"Púlpito Bible","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund sharp jszip@3.10.1 sql.js@1.13.0
          # Importadores ZIP/SQLite locais: funcionam no APK mesmo sem internet.
          mkdir -p www/vendor
          cp node_modules/jszip/dist/jszip.min.js www/vendor/jszip.min.js
          cp node_modules/sql.js/dist/sql-wasm.js www/vendor/sql-wasm.js
          cp node_modules/sql.js/dist/sql-wasm.wasm www/vendor/sql-wasm.wasm
          python3 - <<'PY'
          from pathlib import Path
          p=Path("www/index.html")
          html=p.read_text()
          html=html.replace("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js","./vendor/jszip.min.js")
          html=html.replace("https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/sql-wasm.js","./vendor/sql-wasm.js")
          p.write_text(html)
          Path("www/pulpito.html").write_text(html)
          p=Path("www/app.js")
          app=p.read_text().replace('return "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.13.0/"+f;', 'return "./vendor/"+f;')
          p.write_text(app)
          PY
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          text=p.read_text()
          permission='<uses-permission android:name="android.permission.RECORD_AUDIO" />'
          if permission not in text:
              text=text.replace("<application",permission+"\n    <application",1)
          p.write_text(text)
          PY
          npx cap sync android
      - name: Add native APK updater plugin
        run: |
          mkdir -p android/app/src/main/java/com/pulpitobible/app android/app/src/main/res/xml
          cat > android/app/src/main/java/com/pulpitobible/app/ApkUpdaterPlugin.java <<'JAVA'
          package com.pulpitobible.app;
          
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.database.Cursor;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileInputStream;
          import java.security.MessageDigest;
          
          @CapacitorPlugin(name = "ApkUpdater")
          public class ApkUpdaterPlugin extends Plugin {
            private static final String PREFS = "pulpito_apk_update";
            private static final String KEY_ID = "download_id";
            private static final String KEY_SHA = "expected_sha256";
            private static final String KEY_VERSION = "version_name";
          
            @PluginMethod
            public void getInstalledVersion(PluginCall call) {
              try {
                PackageInfo info;
                if (Build.VERSION.SDK_INT >= 33) info = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), android.content.pm.PackageManager.PackageInfoFlags.of(0));
                else info = getContext().getPackageManager().getPackageInfo(getContext().getPackageName(), 0);
                JSObject result = new JSObject();
                result.put("versionCode", Build.VERSION.SDK_INT >= 28 ? info.getLongVersionCode() : info.versionCode);
                result.put("versionName", info.versionName == null ? "" : info.versionName);
                call.resolve(result);
              } catch (Exception e) { call.reject("Não foi possível ler a versão instalada.", e); }
            }
          
            @PluginMethod
            public void startDownload(PluginCall call) {
              String url = call.getString("url");
              String sha = call.getString("sha256");
              String version = call.getString("versionName", "atualização");
              if (url == null || !url.startsWith("https://") || sha == null || !sha.matches("(?i)[0-9a-f]{64}")) {
                call.reject("Endereço ou hash da atualização inválido."); return;
              }
              try {
                DownloadManager manager = (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                DownloadManager.Request request = new DownloadManager.Request(Uri.parse(url));
                request.setTitle("Púlpito Bible — " + version);
                request.setDescription("Baixando atualização do aplicativo");
                request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                request.setAllowedOverMetered(true);
                request.setAllowedOverRoaming(false);
                request.setDestinationInExternalFilesDir(getContext(), Environment.DIRECTORY_DOWNLOADS, "pulpito-bible-update.apk");
                long id = manager.enqueue(request);
                SharedPreferences prefs = getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                prefs.edit().putLong(KEY_ID, id).putString(KEY_SHA, sha.toLowerCase()).putString(KEY_VERSION, version).apply();
                call.resolve();
              } catch (Exception e) { call.reject("Não foi possível iniciar o download.", e); }
            }
          
            @PluginMethod
            public void getDownloadStatus(PluginCall call) {
              try {
                SharedPreferences prefs = getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                long id = prefs.getLong(KEY_ID, -1);
                JSObject result = new JSObject();
                if (id < 0) { result.put("status", "idle"); call.resolve(result); return; }
                DownloadManager manager = (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                Cursor cursor = manager.query(new DownloadManager.Query().setFilterById(id));
                if (cursor == null || !cursor.moveToFirst()) { if(cursor!=null)cursor.close(); result.put("status","failed"); result.put("reason","Download não encontrado."); call.resolve(result); return; }
                int status = cursor.getInt(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                long downloaded = cursor.getLong(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                long total = cursor.getLong(cursor.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                cursor.close();
                result.put("downloadedBytes", downloaded); result.put("totalBytes", total);
                if (status == DownloadManager.STATUS_SUCCESSFUL) {
                  if (!verifyAndInstall(manager, id, prefs)) { result.put("status","failed"); result.put("reason","A verificação de integridade do APK falhou."); }
                  else result.put("status","complete");
                } else if (status == DownloadManager.STATUS_FAILED) { result.put("status","failed"); result.put("reason","O Android não conseguiu concluir o download."); }
                else result.put("status","downloading");
                call.resolve(result);
              } catch (Exception e) { call.reject("Não foi possível consultar o download.", e); }
            }
          
            @PluginMethod
            public void installPending(PluginCall call) {
              try {
                SharedPreferences prefs = getContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                long id = prefs.getLong(KEY_ID, -1);
                if (id < 0) { call.resolve(); return; }
                DownloadManager manager = (DownloadManager) getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                Cursor c = manager.query(new DownloadManager.Query().setFilterById(id));
                boolean done = c != null && c.moveToFirst() && c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS)) == DownloadManager.STATUS_SUCCESSFUL;
                if (c != null) c.close();
                if (done) { if (!verifyAndInstall(manager,id,prefs)) call.reject("APK inválido ou incompleto."); else call.resolve(); }
                else call.resolve();
              } catch (Exception e) { call.reject("Não foi possível abrir o instalador.", e); }
            }
          
            private boolean verifyAndInstall(DownloadManager manager, long id, SharedPreferences prefs) throws Exception {
              File apk = new File(getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "pulpito-bible-update.apk");
              if (!apk.isFile() || apk.length() == 0) return false;
              String expected = prefs.getString(KEY_SHA, "");
              MessageDigest digest = MessageDigest.getInstance("SHA-256");
              try (FileInputStream in = new FileInputStream(apk)) { byte[] b = new byte[8192]; int n; while ((n=in.read(b))>0) digest.update(b,0,n); }
              StringBuilder actual = new StringBuilder(); for(byte b:digest.digest()) actual.append(String.format("%02x",b));
              if (!actual.toString().equalsIgnoreCase(expected)) { manager.remove(id); apk.delete(); return false; }
              Uri uri = FileProvider.getUriForFile(getContext(), getContext().getPackageName()+".fileprovider", apk);
              Intent intent = new Intent(Intent.ACTION_VIEW);
              intent.setDataAndType(uri, "application/vnd.android.package-archive");
              intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
              if (Build.VERSION.SDK_INT >= 26 && !getContext().getPackageManager().canRequestPackageInstalls()) {
                Intent settings = new Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:"+getContext().getPackageName()));
                settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); getContext().startActivity(settings); return true;
              }
              getContext().startActivity(intent);
              return true;
            }
          }
          JAVA
          cat > android/app/src/main/java/com/pulpitobible/app/MainActivity.java <<'JAVA'
          package com.pulpitobible.app;
          
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ApkUpdaterPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
          cat > android/app/src/main/res/xml/pulpito_file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <external-files-path name="apk_updates" path="Download/" />
          </paths>
          XML
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          permission='    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if 'android.permission.REQUEST_INSTALL_PACKAGES' not in s:
              s=s.replace('<application',permission+'\n    <application',1)
          provider='''        <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/pulpito_file_paths" />
                  </provider>'''
          if 'androidx.core.content.FileProvider' not in s:
              s=s.replace('</application>',provider+'\n    </application>',1)
          p.write_text(s)
          PY
          node --input-type=module <<'NODE'
          import sharp from "sharp";
          import fs from "node:fs";
          const sizes={mdpi:48,hdpi:72,xhdpi:96,xxhdpi:144,xxxhdpi:192};
          const icon=await sharp("pulpito-icon-official.svg",{density:384}).png().toBuffer();
          // Legacy launcher: full icon; no additional Android foreground scaling.
          // Adaptive launcher: Android masks the outer 18dp on each side of a 108dp canvas.
          // Keep the entire artwork inside the central 66dp safe area to avoid cropping.
          for(const [density,size] of Object.entries(sizes)){
            const dir="android/app/src/main/res/mipmap-"+density;
            fs.mkdirSync(dir,{recursive:true});
            const legacy=await sharp(icon).resize(size,size).png().toBuffer();
            fs.writeFileSync(dir+"/ic_launcher.png",legacy);
            fs.writeFileSync(dir+"/ic_launcher_round.png",legacy);
            const canvas=Math.round(size*108/48);
            const safe=Math.round(canvas*0.61);
            await sharp(icon).resize(safe,safe).extend({
              top:Math.floor((canvas-safe)/2),
              bottom:Math.ceil((canvas-safe)/2),
              left:Math.floor((canvas-safe)/2),
              right:Math.ceil((canvas-safe)/2),
              background:{r:0,g:0,b:0,alpha:0}
            }).png().toFile(dir+"/ic_launcher_foreground.png");
          }
          // Remove generated adaptive icon XML and replace with a solid blue
          // background plus the padded foreground; prevents doubled zoom.
          const bgDir="android/app/src/main/res/values";
          fs.mkdirSync(bgDir,{recursive:true});
          fs.writeFileSync(bgDir+"/pulpito_icon_background.xml",
            '<?xml version="1.0" encoding="utf-8"?><resources><color name="pulpito_icon_background">#08214e</color></resources>');
          for(const folder of ["mipmap-anydpi-v26"]){
            const dir="android/app/src/main/res/"+folder;
            fs.mkdirSync(dir,{recursive:true});
            for(const name of ["ic_launcher.xml","ic_launcher_round.xml"]){
              fs.writeFileSync(dir+"/"+name,
                '<?xml version="1.0" encoding="utf-8"?>\n'+
                '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'+
                '  <background android:drawable="@color/pulpito_icon_background"/>\n'+
                '  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'+
                '</adaptive-icon>\n');
            }
          }
          NODE
      # Nova tentativa de assinatura após correção da senha do keystore (2026-11-10).
      - name: Configure stable release signing and version
        id: release
        env:
          PULPITO_KEYSTORE_BASE64: ${{ secrets.PULPITO_KEYSTORE_BASE64 }}
          PULPITO_KEYSTORE_PASSWORD: ${{ secrets.PULPITO_KEYSTORE_PASSWORD }}
          PULPITO_KEY_ALIAS: ${{ secrets.PULPITO_KEY_ALIAS }}
          PULPITO_KEY_PASSWORD: ${{ secrets.PULPITO_KEY_PASSWORD }}
          PULPITO_VERSION_CODE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib,re
          required=["PULPITO_KEYSTORE_BASE64","PULPITO_KEYSTORE_PASSWORD","PULPITO_KEY_ALIAS","PULPITO_KEY_PASSWORD"]
          missing=[k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit("Assinatura permanente não configurada. Adicione os quatro GitHub Actions secrets: "+", ".join(missing))
          root=pathlib.Path("android/app")
          (root/"pulpito-release.jks").write_bytes(base64.b64decode(os.environ["PULPITO_KEYSTORE_BASE64"],validate=True))
          gradle=root/"build.gradle"
          content=gradle.read_text()
          # Capacitor Android uses Groovy Gradle. The release signing is configured only
          # after reading the persistent GitHub Actions secrets, never in the repository.
          content=content.replace("android {", """android {
              signingConfigs {
                  pulpitoRelease {
                      storeFile file("pulpito-release.jks")
                      storePassword System.getenv("PULPITO_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("PULPITO_KEY_ALIAS")
                      keyPassword System.getenv("PULPITO_KEY_PASSWORD")
                  }
              }
          """,1)
          # Keep CI versions ahead of the two signed APKs built outside Actions.
          version_code = int(os.environ["PULPITO_VERSION_CODE"]) + 2
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version_code={version_code}\n")
          content=re.sub(r'versionCode\s+\d+', 'versionCode '+str(version_code),content,count=1)
          content=re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.'+str(version_code)+'"',content,count=1)
          content=content.replace("release {", "release {\n            signingConfig signingConfigs.pulpitoRelease",1)
          gradle.write_text(content)
          PY
      - name: Build signed updateable release APK
        env:
          PULPITO_KEYSTORE_PASSWORD: ${{ secrets.PULPITO_KEYSTORE_PASSWORD }}
          PULPITO_KEY_ALIAS: ${{ secrets.PULPITO_KEY_ALIAS }}
          PULPITO_KEY_PASSWORD: ${{ secrets.PULPITO_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Prepare release APK filename
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/pulpito-bible.apk
      - name: Calculate APK SHA-256
        id: apkmeta
        run: |
          sha256=$(sha256sum release-assets/pulpito-bible.apk | awk '{print $1}')
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
      - name: Publish signed APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pulpito-latest
          name: Púlpito Bible — versão atual
          body: APK oficial assinado do Púlpito Bible. Atualização instalada pelo Android, preservando os dados do aplicativo.
          files: release-assets/pulpito-bible.apk
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
      - name: Publish updater manifest
        uses: actions/github-script@v7
        env:
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          VERSION_SHA256: ${{ steps.apkmeta.outputs.sha256 }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = "pulpito-release.json";
            const versionCode = Number(process.env.VERSION_CODE);
            const manifest = {
              version_code: versionCode,
              version_name: "1.0." + versionCode,
              apk_url: "https://github.com/" + owner + "/" + repo + "/releases/download/pulpito-latest/pulpito-bible.apk",
              sha256: process.env.VERSION_SHA256,
              published_at: new Date().toISOString()
            };
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner, repo, path, ref: context.ref});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, branch: context.ref.replace("refs/heads/", ""),
              message: "Publica manifesto da atualização Púlpito Bible " + manifest.version_name,
              content: Buffer.from(JSON.stringify(manifest, null, 2)).toString("base64"),
              ...(sha ? {sha} : {})
            });
      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pulpito-bible-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  publish-site:
    if: github.ref == 'refs/heads/pulpito-bible-pwa'
    needs: android-apk
    permissions:
      contents: write
    uses: ./.github/workflows/sync-pulpito-sites.yml
    with:
      version_code: ${{ needs.android-apk.outputs.version_code }}
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.PULPITO_RENDER_DEPLOY_HOOK }}

# Release publication includes the signed APK and SHA-256 updater manifest.
